    .txt-white { fill: #f0f6fc; font-weight: 600; }
    
    .box-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8px; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
